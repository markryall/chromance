[project]
name = "chromance"
version = "0.1.0"
description = "Named Chrome profiles that scripts can drive over DevTools, never your everyday one"
requires-python = ">=3.11"
dependencies = ["playwright"]

[project.scripts]
chromance = "chromance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
